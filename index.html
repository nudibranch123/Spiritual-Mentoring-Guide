<title>상호 영성 멘토링</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 한 화면 앱. 멘토는 장미빛, 멘티는 청록빛. 밝은 톤 하나로만 디자인한다. */
:root {
  color-scheme: light;
  --home-bg: #FBF8F3; --home-fg: #2B2622; --home-sub: #4F4640;
  --rose: #B23A55; --teal: #1F6C78;
  --bg: var(--home-bg); --fg: var(--home-fg); --sub: var(--home-sub);
  --accent: var(--rose); --tint: #F7DCD9; --tint-soft: #FAEAE6; --line: #EFD3D3; --dashed: #C99AA3; --strong: #4A1F2A;
  --surface: #FFFFFF;
  --gold: #E6C77F; --cream: #FBF3E2; --ink: #2F2620; --outside: #EFEAE3;
  --display: 'Gowun Batang', 'Noto Serif CJK KR', 'Apple SD Gothic Neo', serif;
  --body: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --gutter-l: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
}
#app[data-role="mentor"] { --bg: #FDF6F1; --fg: #4A1F2A; --sub: #7A3C4C; --accent: var(--rose); --tint: #F7DCD9; --tint-soft: #FAEAE6; --line: #EFD3D3; --dashed: #C99AA3; --strong: #4A1F2A; }
#app[data-role="mentee"] { --bg: #F2F7F5; --fg: #12383F; --sub: #36595F; --accent: var(--teal); --tint: #DCECEA; --tint-soft: #E8F2F0; --line: #C7DEDC; --dashed: #8FB5B5; --strong: #12383F; }

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--outside); font-family: var(--body); word-break: keep-all; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: default; }
h1, h2, h3, p, ul { margin: 0; }
img { display: block; max-width: 100%; }

#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden; }
.pad { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
.foot { flex: none; padding-top: 10px; padding-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.display { font-family: var(--display); font-weight: 700; }

/* 상단 */
.top { flex: none; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.nav-left { display: flex; align-items: center; gap: 2px; margin-left: -10px; }
.icon-btn { width: 44px; height: 44px; flex: none; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--fg); display: flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chip { margin-left: 6px; padding: 5px 14px; border-radius: 999px; background: var(--accent); color: #FFFFFF; font-size: 14px; font-weight: 700; }
.ghost { min-height: 44px; padding: 0 4px 0 8px; border: 0; background: transparent; color: var(--sub); font-size: 14px; font-weight: 500; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.step { min-height: 40px; padding: 6px 0 0; border: 0; border-top: 4px solid var(--line); background: transparent; color: var(--sub); font-size: 13px; }
.step.on { border-top-color: var(--accent); }
.step.now { color: var(--accent); font-weight: 700; }

/* 버튼 */
.cta { width: 100%; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 14px; background: var(--strong); color: #FFFFFF; font-size: 16px; font-weight: 700; }
.cta.accent { background: var(--accent); }
.cta:disabled { opacity: .4; }
.sub-btn { min-height: 48px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--sub); font-size: 15px; font-weight: 500; }

/* 첫 화면 */
.hero { width: 100%; aspect-ratio: 4 / 3; max-height: 36vh; object-fit: cover; flex: 0 1 auto; }
.home-body { flex: 1 0 auto; padding-top: 22px; padding-bottom: 8px; display: flex; flex-direction: column; gap: 10px; }
.kicker { font-size: 14px; font-weight: 500; color: var(--sub); }
.home-title { font-family: var(--display); font-size: 27px; line-height: 1.35; font-weight: 700; text-wrap: balance; }
.lede { font-size: 15px; line-height: 1.65; color: var(--sub); }
.role-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 68px; padding: 8px 20px; border: 0; border-radius: 16px; color: #FFFFFF; text-align: left; }
.role-btn b { display: block; font-size: 18px; }
.role-btn small { display: block; margin-top: 1px; font-size: 13px; }
.role-btn span.arrow { font-size: 22px; }
.role-btn.mentor { background: var(--rose); }
.role-btn.mentee { background: var(--teal); }
.legal { margin-top: 6px; font-size: 12px; line-height: 1.6; color: var(--home-sub); text-align: center; overflow-wrap: normal; }
.linklike { align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--home-fg); font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 4px; }

/* 읽는 화면 */
.read { padding-top: 12px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 100%; }
.read h1 { font-family: var(--display); font-size: 26px; line-height: 1.35; color: var(--accent); text-wrap: balance; }
.read h2 { font-size: 17px; font-weight: 700; }
.read p, .read li { font-size: 16px; line-height: 1.7; }
.read section { display: flex; flex-direction: column; gap: 6px; }
.bul { padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.read .note { padding: 12px 16px; border-radius: 14px; background: var(--tint); font-size: 15px; line-height: 1.6; }
.pageno { font-size: 13px; color: var(--sub); }

/* 대화 나누기 */
.talk { flex: 1 0 auto; padding-top: 12px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 16px; }
.theme { padding: 16px 18px; border-radius: 16px; background: var(--accent); color: #FFFFFF; display: flex; flex-direction: column; gap: 8px; }
.theme h1 { font-family: var(--display); font-size: 26px; line-height: 1.3; }
.theme p { font-size: 16px; line-height: 1.6; }
.theme p + p { margin-top: 2px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, .4); }
.way { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; }
.way > i { width: 38px; height: 38px; border-radius: 50%; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-style: normal; font-size: 21px; font-weight: 700; }
.way h2 { font-size: 17px; line-height: 38px; }
.way p { font-size: 15px; line-height: 1.6; }
.qa-list { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }

/* 분별 */
.discern { padding-top: 10px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
.discern .lead { font-size: 16px; line-height: 1.6; }
.discern .lead b { color: var(--accent); }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode { padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); overflow: hidden; text-align: left; display: flex; flex-direction: column; }
.mode img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.mode span { padding: 8px 10px 9px; display: block; font-size: 16px; font-weight: 700; }
.mode small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; line-height: 1.4; }
.hint { font-size: 14px; color: var(--sub); text-align: center; }

/* 다음 스텝: 보드게임 카드 */
.pick { flex: 1 0 auto; display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.pick .lead { font-size: 16px; line-height: 1.5; text-align: center; }
.pick .lead b { color: var(--accent); }
.stage { position: relative; flex: 1 1 auto; min-height: 332px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.gcard { position: absolute; left: 50%; top: 50%; width: var(--cw, 270px); height: var(--ch, 400px); margin-left: calc(var(--cw, 270px) / -2); margin-top: calc(var(--ch, 400px) / -2); padding: 8px; border: 0; border-radius: 20px; background: var(--frame); color: #FFFFFF; box-shadow: 0 8px 18px rgba(40, 30, 30, .28); transition: transform .28s ease, opacity .28s ease; }
.stage.dragging .gcard { transition: none; }
.gcard-in { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 10px; border: 1.5px solid var(--gold); border-radius: 14px; }
.gcard-head { flex: none; display: flex; align-items: center; justify-content: space-between; }
.gcard-no { width: 30px; height: 30px; border-radius: 50%; background: var(--cream); color: var(--frame); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 17px; font-weight: 700; }
.gcard-name { font-family: var(--display); font-size: 24px; font-weight: 700; }
.gcard-star { width: 30px; color: var(--gold); font-size: 18px; text-align: right; }
.gcard-art { flex: 1 1 0; min-height: 64px; width: 100%; object-fit: cover; border: 2px solid var(--gold); border-radius: 110px 110px 8px 8px; }
.gcard-key { flex: none; align-self: center; margin-top: -20px; padding: 3px 16px; border-radius: 999px; background: var(--gold); color: #3A2A14; font-size: 13px; font-weight: 700; position: relative; }
.gcard-text { flex: none; min-height: 130px; padding: 9px 11px; border-radius: 8px; background: var(--cream); color: var(--ink); font-size: 13.5px; line-height: 1.55; text-align: left; }
.stamp { position: absolute; top: -2px; right: -2px; width: 46px; height: 46px; border-radius: 50%; border: 3px solid #FFFFFF; background: var(--accent); color: #FFFFFF; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.stamp[hidden] { display: none; }
.ctrl { display: flex; align-items: center; gap: 10px; }
.round { width: 48px; height: 48px; flex: none; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--accent); font-size: 20px; }
.round:disabled { opacity: .35; }
.toggle { flex: 1 1 auto; min-width: 0; min-height: 48px; padding: 4px 8px; border: 2px solid var(--accent); border-radius: 14px; background: var(--accent); color: #FFFFFF; font-size: 16px; font-weight: 700; }
.toggle.off { background: var(--surface); color: var(--accent); }
.toggle:disabled { opacity: .5; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.slot { min-height: 44px; padding: 2px 6px; border: 1.5px dashed var(--dashed); border-radius: 10px; background: transparent; color: var(--sub); font-size: 14px; }
.slot.full { border-style: solid; border-color: var(--frame); background: var(--frame); color: #FFFFFF; font-weight: 700; }

/* 오늘의 카드 */
.today { padding-top: 10px; padding-bottom: 8px; display: flex; flex-direction: column; gap: 10px; }
.today-img { width: 100%; aspect-ratio: 9 / 10; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); -webkit-touch-callout: default; }
.save-msg { font-size: 14px; line-height: 1.55; color: var(--sub); text-align: center; }
.save-msg[hidden] { display: none; }
.today .linklike { align-self: center; color: var(--sub); font-size: 14px; font-weight: 400; }
/* 버튼 모양 위에 저장할 이미지를 투명하게 덮어, 길게 누르면 그 이미지의 저장 메뉴가 뜨게 한다 */
.hold-btn { position: relative; min-height: 56px; border-radius: 14px; background: var(--accent); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hold-btn:active { filter: brightness(.85); }
.hold-btn img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: fill; opacity: .01; -webkit-touch-callout: default; }
.foot-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.foot-row .sub-btn:last-child { background: var(--strong); border-color: var(--strong); color: #FFFFFF; }

/* 멘토 마무리 */
.finish { padding-top: 12px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
.finish h1 { font-family: var(--display); font-size: 26px; color: var(--accent); }
.minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.minis.one { grid-template-columns: minmax(0, 200px); justify-content: center; }
.mini { padding: 6px; border-radius: 14px; background: var(--frame); color: #FFFFFF; }
.mini > div { height: 100%; padding: 8px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--gold); border-radius: 10px; }
.mini h2 { font-family: var(--display); font-size: 18px; text-align: center; }
.mini img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border: 1.5px solid var(--gold); border-radius: 60px 60px 6px 6px; }
.mini p { flex-grow: 1; padding: 7px 8px; border-radius: 6px; background: var(--cream); color: var(--ink); font-size: 13px; line-height: 1.5; }

/* 아래에서 올라오는 안내 */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(40, 25, 30, .5); display: flex; flex-direction: column; justify-content: flex-end; }
.sheet { max-height: 86%; overflow-y: auto; padding-top: 12px; padding-bottom: 20px; background: var(--bg); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px; animation: rise .22s ease; }
@keyframes rise { from { transform: translateY(24px); } to { transform: none; } }
.grab { flex: none; align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { font-family: var(--display); font-size: 26px; color: var(--accent); }
.sheet p, .sheet li { font-size: 16px; line-height: 1.65; }
.sheet ul { padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.sheet section { display: flex; flex-direction: column; gap: 6px; }
.sheet h3 { font-size: 16px; }
.qa { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.qa.open { border: 2px solid var(--accent); }
.qa > button { width: 100%; min-height: 48px; padding: 8px 14px; border: 0; background: transparent; color: var(--fg); font-size: 15px; font-weight: 500; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.qa > button i { font-style: normal; font-size: 20px; color: var(--accent); }
.qa.open > button { color: var(--accent); font-weight: 700; }
.qa p { padding: 0 14px 12px; }
.sheet-art { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; }

@media (max-height: 760px) {
  .hero { max-height: 24vh; }
}

/* 주소창 때문에 세로가 짧은 폰 */
@media (max-height: 640px) {
  .hero { max-height: 20vh; }
  .home-body { padding-top: 12px; gap: 6px; }
  .home-title { font-size: 22px; }
  .lede { font-size: 14px; }
  .role-btn { min-height: 56px; }
  .linklike { min-height: 36px; }
  .talk { gap: 12px; padding-top: 8px; }
  .theme { padding: 12px 14px; gap: 6px; }
  .theme h1 { font-size: 22px; }
  .theme p { font-size: 15px; }
  .step { min-height: 28px; padding-top: 4px; }
  .cta { min-height: 48px; }
  .stage { min-height: 292px; }
  .gcard-text { min-height: 110px; }
  .pick { gap: 4px; padding-top: 4px; }
  .ctrl { position: sticky; bottom: 0; z-index: 20; padding-block: 4px; background: var(--bg); }
  .slot { min-height: 36px; font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  .gcard { transition: none; }
  .sheet { animation: none; }
}
</style>

</head>

    var stage = document.getElementById('stage');
    if (!stage) { return; }
    var w = Math.min(270, Math.round(stage.clientWidth * 0.76));
    var h = Math.max(292, Math.min(400, stage.clientHeight - 12));
    stage.style.setProperty('--cw', w + 'px');
    stage.style.setProperty('--ch', h + 'px');
    var step = w * 0.93;
    stage.querySelectorAll('.gcard').forEach(function (el) {
      var i = Number(el.dataset.i);
      var d = i - S.idx;
      var a = Math.abs(d);
      el.style.transform = 'translateX(' + (d * step + drag) + 'px) rotate(' + (d * 5) + 'deg) scale(' + (d === 0 ? 1 : 0.88) + ')';
      el.style.opacity = a > 1 ? '0' : '1';
      el.style.zIndex = String(10 - a);
      el.style.pointerEvents = a > 1 ? 'none' : 'auto';
      el.tabIndex = a > 1 ? -1 : 0;
      el.querySelector('.stamp').hidden = S.sel.indexOf(i) < 0;
      el.setAttribute('aria-pressed', String(S.sel.indexOf(i) >= 0));
    });
  }
  function refreshPick() {
    if (!document.getElementById('stage')) { return; }
    layoutCards();
    var isSel = S.sel.indexOf(S.idx) >= 0;
    var full = S.sel.length >= 2 && !isSel;
    var t = document.getElementById('toggle');
    t.textContent = isSel ? '선택 취소하기' : (full ? '2장을 모두 골랐습니다' : '이 카드 선택하기');
    t.disabled = full;
    t.classList.toggle('off', isSel);
    document.getElementById('prev').disabled = S.idx === 0;
    document.getElementById('next').disabled = S.idx === CARDS.length - 1;
    document.getElementById('finish').disabled = S.sel.length === 0;
    document.getElementById('slots').innerHTML = [0, 1].map(function (k) {
      var i = S.sel[k];
      if (i === undefined) {
        return '<button class="slot" disabled>' + (k === 0 ? '첫 번째 카드' : '두 번째 카드(선택)') + '</button>';
      }
      return '<button class="slot full" style="--frame:' + CARDS[i].frame + '" data-act="slot" data-i="' + i + '">' + CARDS[i].name + '</button>';
    }).join('');
  }
  function toggleCurrent() {
    var p = S.sel.indexOf(S.idx);
    if (p >= 0) { S.sel.splice(p, 1); }
    else if (S.sel.length < 2) { S.sel.push(S.idx); }
    S.imageUrl = null;
    refreshPick();
  }
  function bindSwipe() {
    var stage = document.getElementById('stage');
    if (!stage) { return; }
    var startX = 0, startY = 0, active = false, moved = false, justDragged = false;
    stage.addEventListener('pointerdown', function (e) { active = true; moved = false; startX = e.clientX; startY = e.clientY; });
    stage.addEventListener('pointermove', function (e) {
      if (!active) { return; }
      var dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - startY)) {
        moved = true;
        stage.classList.add('dragging');
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 일부 브라우저는 거부함 */ }
      }
      if (moved) { drag = dx; layoutCards(); }
    });
    function end() {
      if (!active) { return; }
      active = false;
      stage.classList.remove('dragging');
      if (moved) {
        if (drag < -40 && S.idx < CARDS.length - 1) { S.idx++; }
        else if (drag > 40 && S.idx > 0) { S.idx--; }
        justDragged = true;
        setTimeout(function () { justDragged = false; }, 50);
      }
      drag = 0;
      refreshPick();
    }
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
    stage.addEventListener('click', function (e) {
      if (justDragged) { return; }
      var card = e.target.closest('.gcard');
      if (!card) { return; }
      var i = Number(card.dataset.i);
      if (i !== S.idx) { S.idx = i; refreshPick(); return; }
      if (S.sel.length < 2 || S.sel.indexOf(i) >= 0) { toggleCurrent(); }
    });
  }

  /* ---------- 안내 시트 ---------- */
  function openSheet(title, body) {
    closeSheet();
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.id = 'scrim';
    scrim.innerHTML = '<div class="sheet pad" role="dialog" aria-modal="true" aria-label="' + title + '"><div class="grab"></div>' +
      '<div class="sheet-head"><h2>' + title + '</h2><button class="ghost" data-act="close" id="sheetClose">닫기</button></div>' + body + '</div>';
    app.appendChild(scrim);
    document.getElementById('sheetClose').focus();
  }
  function closeSheet() {
    var s = document.getElementById('scrim');
    if (s) { s.remove(); }
  }
  function qaHtml(openIdx) {
    return QUESTIONS.map(function (x, i) {
      var open = i === openIdx;
      return '<div class="qa' + (open ? ' open' : '') + '"><button data-act="qa" data-i="' + i + '" aria-expanded="' + open + '"><span>' + x.q + '</span><i aria-hidden="true">' + (open ? '−' : '+') + '</i></button>' + (open ? '<p>' + x.a + '</p>' : '') + '</div>';
    }).join('');
  }

  /* ---------- 저장 이미지 ---------- */
  function roundRect(ctx, x, y, w, h, r) {
    var rr = typeof r === 'number' ? [r, r, r, r] : r;
    ctx.beginPath();
    ctx.moveTo(x + rr[0], y);
    ctx.lineTo(x + w - rr[1], y);
    ctx.arcTo(x + w, y, x + w, y + rr[1], rr[1]);
    ctx.lineTo(x + w, y + h - rr[2]);
    ctx.arcTo(x + w, y + h, x + w - rr[2], y + h, rr[2]);
    ctx.lineTo(x + rr[3], y + h);
    ctx.arcTo(x, y + h, x, y + h - rr[3], rr[3]);
    ctx.lineTo(x, y + rr[0]);
    ctx.arcTo(x, y, x + rr[0], y, rr[0]);
    ctx.closePath();
  }
  function wrapText(ctx, text, maxW) {
    var lines = [], line = '';
    text.split(' ').forEach(function (word) {
      var t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width <= maxW) { line = t; return; }
      if (line) { lines.push(line); }
      line = word;
      while (ctx.measureText(line).width > maxW) {
        var n = line.length;
        while (n > 1 && ctx.measureText(line.slice(0, n)).width > maxW) { n--; }
        lines.push(line.slice(0, n));
        line = line.slice(n);
      }
    });
    if (line) { lines.push(line); }
    return lines;
  }
  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = reject;
      im.src = src;
    });
  }
  function coverDraw(ctx, im, x, y, w, h) {
    var iw = im.naturalWidth || 400, ih = im.naturalHeight || 300;
    var s = Math.max(w / iw, h / ih);
    var sw = w / s, sh = h / s;
    ctx.drawImage(im, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
  }
  var DISPLAY = "'Gowun Batang','Noto Serif CJK KR',serif";
  var BODY = "'Noto Sans KR','Noto Sans CJK KR',sans-serif";
  function drawCard(ctx, c, im, x, y, w, h) {
    roundRect(ctx, x, y, w, h, 34);
    ctx.fillStyle = c.frame;
    ctx.fill();
    roundRect(ctx, x + 14, y + 14, w - 28, h - 28, 24);
    ctx.strokeStyle = '#E6C77F';
    ctx.lineWidth = 3;
    ctx.stroke();
    var inner = 32;
    var ix = x + inner, iw = w - inner * 2;
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 46px ' + DISPLAY;
    ctx.fillText(c.name, x + w / 2, y + 66);
    var artY = y + 108, artH = Math.round(iw * 0.72);
    roundRect(ctx, ix, artY, iw, artH, [iw / 2, iw / 2, 14, 14]);
    ctx.save();
    ctx.clip();
    coverDraw(ctx, im, ix, artY, iw, artH);
    ctx.restore();
    roundRect(ctx, ix, artY, iw, artH, [iw / 2, iw / 2, 14, 14]);
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.font = '700 26px ' + BODY;
    var kw = ctx.measureText(c.key).width + 52;
    roundRect(ctx, x + w / 2 - kw / 2, artY + artH - 22, kw, 46, 23);
    ctx.fillStyle = '#E6C77F';
    ctx.fill();
    ctx.fillStyle = '#3A2A14';
    ctx.fillText(c.key, x + w / 2, artY + artH + 2);
    var py = artY + artH + 42, ph = y + h - inner - py;
    roundRect(ctx, ix, py, iw, ph, 14);
    ctx.fillStyle = '#FBF3E2';
    ctx.fill();
    ctx.fillStyle = '#2F2620';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '400 30px ' + BODY;
    wrapText(ctx, c.text, iw - 44).forEach(function (l, i) {
      ctx.fillText(l, ix + 22, py + 20 + i * 44);
    });
  }
  function todayLabel() {
    var d = new Date();
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function makeImage() {
    var chosen = chosenCards();
    var fontJobs = [];
    if (document.fonts && document.fonts.load) {
      fontJobs = [
        document.fonts.load("700 46px 'Gowun Batang'", '내면탐험 2026년'),
        document.fonts.load("400 30px 'Noto Sans KR'", '일기 독서 가치관'),
        document.fonts.load("700 26px 'Noto Sans KR'", '고독 기도'),
        document.fonts.load("500 34px 'Noto Sans KR'", '다음 시간')
      ];
    }
    var fontsReady = Promise.race([
      Promise.all(fontJobs).catch(function () {}),
      new Promise(function (r) { setTimeout(r, 2500); })
    ]);
    return fontsReady.then(function () {
      return Promise.all(chosen.map(function (c) { return loadImage(IMG[c.img]); }));
    }).then(function (ims) {
      var W = 1080, H = 1200;
      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#F2F7F5';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#36595F';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '500 34px ' + BODY;
      ctx.fillText('다음 시간까지 집중할 카드', W / 2, 84);
      ctx.fillStyle = '#1F6C78';
      ctx.font = '700 68px ' + DISPLAY;
      ctx.fillText(todayLabel(), W / 2, 158);
      var top = 232, cardH = 850;
      if (chosen.length === 1) {
        drawCard(ctx, chosen[0], ims[0], (W - 560) / 2, top, 560, cardH);
      } else {
        var cw = 480, gap = 28, x0 = (W - cw * 2 - gap) / 2;
        chosen.forEach(function (c, i) { drawCard(ctx, c, ims[i], x0 + i * (cw + gap), top, cw, cardH); });
      }
      ctx.fillStyle = '#36595F';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '400 28px ' + BODY;
      ctx.fillText('상호 영성 멘토링', W / 2, 1136);
      return cv;
    });
  }
  function prepareToday() {
    var el = document.getElementById('todayImg');
    if (!el || S.imageUrl) { return; }
    makeImage().then(function (cv) {
      S.imageUrl = cv.toDataURL('image/png');
      var now = document.getElementById('todayImg');
      if (now) { now.src = S.imageUrl; }
      var hold = document.getElementById('holdImg');
      if (hold) { hold.src = S.imageUrl; }
    }).catch(function () {
      var msg = document.getElementById('saveMsg');
      if (msg) { msg.hidden = false; msg.textContent = '이미지를 만들지 못했습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.'; }
    });
  }
  function fileName() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return 'spiritual-mentoring-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.png';
  }
  function dataUrlToBlob(url) {
    var parts = url.split(',');
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { arr[i] = bin.charCodeAt(i); }
    return new Blob([arr], { type: 'image/png' });
  }
  function openInBrowser() {
    /* 카카오톡을 거치며 # 뒷부분이 사라질 수 있어, 고른 카드를 ? 뒤에 담아 넘긴다 */
    var picks = S.sel.slice().sort(function (x, y) { return x - y; }).join('-');
    var query = '?today=' + picks;
    try { history.replaceState(null, '', location.pathname + query + '#mentee-today-' + picks); } catch (e) { /* 주소를 못 바꿔도 아래 주소로 연다 */ }
    var msg = document.getElementById('saveMsg');
    msg.hidden = false;
    msg.textContent = '브라우저로 이동하지 않으면 카카오톡 메뉴에서 다른 브라우저로 열기를 눌러주세요.';
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.origin + location.pathname + query);
  }
  function saveImage() {
    var msg = document.getElementById('saveMsg');
    var hint = '저장 창이 뜨지 않으면 위 이미지를 길게 눌러 저장해주세요.';
    if (!S.imageUrl) {
      msg.hidden = false;
      msg.textContent = '이미지를 만드는 중입니다. 잠시 후 다시 눌러주세요.';
      return;
    }
    var blob = dataUrlToBlob(S.imageUrl);
    var file = new File([blob], fileName(), { type: 'image/png' });
    function download() {
      var u = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = u; a.download = fileName();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
      msg.hidden = false;
      msg.textContent = '이미지를 내려받았습니다. 갤러리나 다운로드 폴더에서 확인해주세요. 찾을 수 없으면 위 이미지를 길게 눌러 저장해주세요.';
    }
    /* 아이폰은 공유 창의 이미지 저장으로 사진 앱에 저장하고, 그 밖의 기기는 바로 내려받는다 */
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var canShare = false;
    try { canShare = !!(isIOS && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
    if (canShare) {
      navigator.share({ files: [file], title: '오늘의 카드' }).then(function () {
        msg.hidden = false;
        msg.textContent = hint;
      }).catch(function (err) {
        if (err && err.name === 'AbortError') { return; }
        download();
      });
    } else {
      download();
    }
  }

  /* ---------- 라우팅과 이벤트 ---------- */
  function render() {
    var route = location.hash.slice(1) || 'home';
    /* 브라우저로 넘어올 때 주소에 담긴 카드 선택을 되살린다 */
    var carried = route.match(/^mentee-today-([0-3])(?:-([0-3]))?$/);
    if (carried) {
      var picks = [Number(carried[1])];
      if (carried[2] !== undefined && carried[2] !== carried[1]) { picks.push(Number(carried[2])); }
      if (picks.join() !== S.sel.slice().sort(function (a, b) { return a - b; }).join()) { S.sel = picks; S.imageUrl = null; }
      route = 'mentee-today';
    }
    if (!SCREENS[route]) { route = 'home'; }
    if ((route === 'mentor-finish' || route === 'mentee-today') && S.sel.length === 0) {
      route = route === 'mentor-finish' ? 'mentor-next' : 'mentee-next';
    }
    if (route === 'home') { resetSession(); }
    S.route = route;
    var role = /^mentor/.test(route) ? 'mentor' : (/^mentee/.test(route) ? 'mentee' : '');
    if (role) { app.setAttribute('data-role', role); } else { app.removeAttribute('data-role'); }
    app.innerHTML = SCREENS[route]();
    var sc = app.querySelector('.scroll');
    if (sc) { sc.scrollTop = 0; }
    if (document.getElementById('stage')) { bindSwipe(); refreshPick(); }
    if (route === 'mentee-today') { prepareToday(); }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-act]');
    if (!el) {
      if (e.target.id === 'scrim') { closeSheet(); }
      return;
    }
    if (el.dataset.go) { closeSheet(); go(el.dataset.go); return; }
    var i = Number(el.dataset.i);
    switch (el.dataset.act) {
      case 'close': closeSheet(); break;
      case 'ask-home':
        openSheet('처음으로 돌아갈까요?', '<p>' + (S.sel.length ? '지금까지 고른 카드가 사라집니다.' : '지금 진행 중인 단계에서 나가게 됩니다.') + '</p>' +
          '<div class="foot-row"><button class="sub-btn" data-act="close">계속 진행하기</button><button class="sub-btn" data-go="home">처음으로 돌아가기</button></div>');
        break;
      case 'prev': if (S.idx > 0) { S.idx--; refreshPick(); } break;
      case 'next': if (S.idx < CARDS.length - 1) { S.idx++; refreshPick(); } break;
      case 'toggle': toggleCurrent(); break;
      case 'slot': S.idx = i; refreshPick(); break;
      case 'save': saveImage(); break;
      case 'open-browser': openInBrowser(); break;
      case 'hold-hint':
        var note = document.getElementById('saveMsg');
        note.hidden = false;
        note.textContent = S.imageUrl ? '짧게 누르지 말고, 손가락을 떼지 않은 채 꾹 눌러주세요. 메뉴가 뜨면 이미지 저장을 눌러주세요.' : '이미지를 만드는 중입니다. 잠시 후 꾹 눌러주세요.';
        break;
      case 'qa':
        var list = document.getElementById('qaList');
        var isOpen = el.getAttribute('aria-expanded') === 'true';
        list.innerHTML = qaHtml(isOpen ? -1 : i);
        break;
      case 'sheet-mode':
        openSheet(MODES[i].name, img(MODES[i].img, 'sheet-art') + '<ul>' + MODES[i].lines.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul>');
        break;
      case 'sheet-guide':
        if (app.getAttribute('data-role') === 'mentor') {
          openSheet('멘토 가이드', MENTOR_GUIDE + MENTOR_WAYS);
        } else {
          openSheet('멘티 가이드', MENTEE_GUIDE);
        }
        break;
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); } });
  window.addEventListener('hashchange', function () { closeSheet(); render(); });
  window.addEventListener('resize', layoutCards);
  var passed = location.search.match(/[?&]today=([0-3](?:-[0-3])?)/);
  if (passed) {
    try { history.replaceState(null, '', location.pathname + '#mentee-today-' + passed[1]); }
    catch (e) { location.hash = 'mentee-today-' + passed[1]; }
  }
  render();
})();
</script>
